<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ultima Online map</title>
<!--__OG__-->
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet-rotate@0.2.8/dist/leaflet-rotate-src.js"></script>
<style>
  html, body { margin: 0; height: 100%; background: #101014; }
  #map { position: absolute; inset: 0; background: #101014; }
  .readout {
    font: 12px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace;
    background: rgba(16, 16, 20, 0.85); color: #e8e8ea;
    padding: 6px 9px; border-radius: 4px; border: 1px solid #34343c;
  }
  .readout b { color: #9fd0ff; font-weight: 600; }
  .credit {
    font: 11px/1.4 ui-sans-serif, system-ui, -apple-system, sans-serif;
    padding: 0 2px;
    text-shadow: 0 0 3px #101014, 0 0 3px #101014;
  }
  .leaflet-container .credit a { color: #7c7c88; text-decoration: none; }
  .leaflet-container .credit a:hover { color: #9fd0ff; text-decoration: underline; }
  .find { width: 15em; }
  .find input[type=text] {
    font: 12px ui-monospace, Menlo, monospace; flex: 1; min-width: 0;
    background: #1c1c22; color: #e8e8ea; border: 1px solid #34343c;
    border-radius: 3px; padding: 3px 5px;
  }
  .find button {
    font: 12px ui-monospace, Menlo, monospace; margin-left: 4px; cursor: pointer;
    background: #2a2a34; color: #e8e8ea; border: 1px solid #44444e;
    border-radius: 3px; padding: 3px 7px;
  }
  .find .row { display: flex; }
  .leaflet-container { background: #101014; }

  .north a {
    display: flex; align-items: center; justify-content: center; cursor: pointer;
  }
  .north svg { width: 20px; height: 20px; transition: transform 0.3s; }
  .share a {
    display: flex; align-items: center; justify-content: center; cursor: pointer;
  }
  .share svg { width: 18px; height: 18px; }
  .share a.copied { color: #2a9d4b; }

  /* --- points of interest --- */
  /* Grows with the rows, so that opening a category does not leave its subtypes behind a
     scrollbar, and stops short of the bottom of the window, where it scrolls instead. */
  .find .kinds { margin-top: 5px; max-height: max(11em, calc(100vh - 12em)); overflow-y: auto; }
  .find .kinds.off { display: none; }
  .find .kinds label {
    display: flex; align-items: center; gap: 5px; padding: 1px 0;
    color: #9a9aa4; cursor: pointer; user-select: none;
  }
  .find .kinds input { margin: 0; flex: none; accent-color: #ffd479; }
  .find .kinds .sub { padding-left: 32px; }
  .find .kinds .subs.shut { display: none; }
  .find .kinds .fold {
    flex: none; width: 13px; padding: 0; border: 0; background: none; cursor: pointer;
    color: #7c7c88; font: inherit; line-height: 1;
  }
  .find .kinds .fold::before { content: '\25B8'; }
  .find .kinds .fold.open::before { content: '\25BE'; }
  .find .kinds .gap { flex: none; width: 13px; }
  .find .kinds .of {
    flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .find .kinds .n { color: #7c7c88; padding-left: 8px; }
  .find .note { color: #7c7c88; }
  .find ul {
    list-style: none; margin: 5px 0 0; padding: 0;
    max-height: 16em; overflow-y: auto;
  }
  .find ul:empty { display: none; }
  .find li {
    padding: 3px 5px; border-radius: 3px; cursor: pointer;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .find li:hover, .find li.on { background: #2f2f3a; }
  .find li .at { color: #7c7c88; margin-left: 6px; }

  /* A marker is a zero-sized anchor its parts hang off, so that the dot sits exactly on
     the tile whatever the label beside it is doing. */
  .leaflet-div-icon.poi { background: none; border: none; }
  .poi i {
    position: absolute; left: -4px; top: -4px; width: 7px; height: 7px;
    border-radius: 50%; background: var(--c, #ffd479); border: 1px solid #14141a;
    box-shadow: 0 0 0 1px color-mix(in srgb, var(--c, #ffd479) 40%, transparent);
  }
  .find .kinds i.dot {
    flex: none; width: 8px; height: 8px; border-radius: 50%; background: var(--c);
  }
  .leaflet-container .leaflet-marker-pane .poi img {
    /* Leaflet's own `.leaflet-container .leaflet-marker-pane img { max-width: none !important }`
       would otherwise win, and a server-supplied thumbnail (a guild's avatar) is drawn at
       whatever size it was uploaded. Both sides are !important, so it is specificity that
       decides: this selector has to out-rank Leaflet's, `!important` alone does not. */
    position: absolute; left: 0; top: 0; max-width: 28px !important; max-height: 28px !important;
    transform: translate(-50%, -50%) scale(var(--icon-scale, 1)); filter: drop-shadow(0 0 2px #000);
  }
  .poi img + span { left: calc(16px * var(--icon-grow, 1)); }
  /* The tooltip and popup panes are outside the marker pane, so Leaflet's img rule does not reach them. */
  .leaflet-tooltip img.tip, .pop img.tip {
    height: 16px; width: auto; max-width: 28px; vertical-align: middle; margin-right: 5px;
  }
  .find .kinds img { height: 14px; width: auto; flex: none; }
  .poi span {
    position: absolute; left: 7px; top: -9px; white-space: nowrap; pointer-events: none;
    font: 11px/1.4 ui-sans-serif, system-ui, -apple-system, sans-serif; color: #f6ead0;
    text-shadow: 0 0 3px #000, 0 0 3px #000, 0 0 5px #000;
  }
  .leaflet-popup-content-wrapper, .leaflet-popup-tip {
    background: #1c1c22; color: #e8e8ea; border: 1px solid #34343c;
    box-shadow: 0 2px 12px rgba(0, 0, 0, 0.6);
  }
  .leaflet-popup-content {
    margin: 8px 12px; font: 12px/1.6 ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  .leaflet-popup-content b { color: #ffd479; }
  .leaflet-popup-content b a { color: inherit; text-decoration: underline dotted; }
  .leaflet-container a.leaflet-popup-close-button { color: #7c7c88; }
  .pop .cat { color: #9fd0ff; }
  .pop .desc { color: #c8c8d0; white-space: normal; max-width: 18em; }
  .pop .at { color: #7c7c88; }
</style>
</head>
<body>
<div id="map"></div>
<script>
const CFG = /*__CONFIG__*/null;

// Markers embedded at generation time, from every file source merged. Null when no
// source was a file; the ones the page fetches itself are listed in CFG.poiSources.
const POIS = /*__POIS__*/null;

// A transparent 1x1 PNG, served for slices that were never written whatever the tiles
// themselves are encoded as. Ocean and the area off the edge of the facet have no files
// at all, and this keeps those quiet.
const BLANK = 'data:image/png;base64,' +
  'iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAAC0lEQVR42mNkYAAAAAYAAjCB0C8AAAAASUVORK5CYII=';

// Units are canvas pixels at the grid's deepest level, y increasing downward, so the
// tile grid is addressed exactly as generated. latLng carries (y, x).
const CRS = L.extend({}, L.CRS.Simple, {
  transformation: new L.Transformation(1, 0, 1, 0),
  scale: z => Math.pow(2, z - CFG.gridMaxZoom),
  zoom: s => Math.log(s) / Math.LN2 + CFG.gridMaxZoom,
  infinite: true,
});

// Let the deepest generated level be magnified a little. On a pyramid capped with
// --max-zoom the finest tiles are still coarse, and upscaling them beats refusing to
// zoom at all.
const OVERZOOM = 2;
const VIEW_MAX = CFG.maxZoom + OVERZOOM;

const bounds = L.latLngBounds(
  L.latLng(0, 0),
  L.latLng(CFG.canvasHeight, CFG.canvasWidth));

const map = L.map('map', {
  crs: CRS,
  minZoom: CFG.minZoom,
  maxZoom: VIEW_MAX,
  zoomControl: true,
  attributionControl: false,
  maxBounds: bounds.pad(0.05),
  zoomSnap: 0,
  // Rotation exists for the one button below. The plugin's own compass control and
  // touch/shift gestures would let the map be turned to angles nobody asked for.
  rotate: true,
  bearing: 0,
  rotateControl: false,
  touchRotate: false,
  shiftKeyRotate: false,
  compassBearing: false,
});

L.tileLayer('{z}/{x}/{y}' + CFG.extension, {
  tileSize: CFG.sliceSize,
  minZoom: CFG.minZoom,
  maxZoom: VIEW_MAX,
  minNativeZoom: CFG.minZoom,
  maxNativeZoom: CFG.maxZoom,
  bounds: bounds,
  noWrap: true,
  errorTileUrl: BLANK,
  keepBuffer: 2,
}).addTo(map);

// --- rotate to north ---------------------------------------------------------------

// The slices are drawn in the client's isometric view, in which north runs towards the
// upper right. Turning the whole map a quarter-octant anticlockwise puts it straight up.
// Canvas x and y use the same scale (see canvasAt), so this is a pure rotation with no
// shear to undo.
const NORTH_UP = 315;

const north = L.control({ position: 'topleft' });
north.onAdd = function () {
  const div = L.DomUtil.create('div', 'leaflet-bar north');
  const a = L.DomUtil.create('a', '', div);
  a.href = '#';
  a.setAttribute('role', 'button');
  a.innerHTML =
    '<svg viewBox="0 0 24 24"><path d="M12 2l5 11H7z" fill="#c33"/>' +
    '<path d="M12 22l-5-9h10z" fill="#999"/></svg>';
  this._svg = a.querySelector('svg');
  this._a = a;

  L.DomEvent.on(a, 'click', e => {
    L.DomEvent.stop(e);
    map.setBearing(map.getBearing() === 0 ? NORTH_UP : 0);
  });
  L.DomEvent.disableClickPropagation(div);
  this.update();
  return div;
};
// The arrow points at north wherever north currently is: 45 degrees clockwise from the
// top of the screen when the map is as rendered, straight up once it has been turned.
north.update = function () {
  const b = map.getBearing();
  this._svg.style.transform = `rotate(${b + 45}deg)`;
  this._a.title = b === 0 ? 'Rotate map to north' : 'Restore the original view';
};
north.addTo(map);
map.on('rotate', () => north.update());

// --- share the view ----------------------------------------------------------------

// The link carries the query form rather than the hash: it is the one that survives being
// pasted into chat clients that drop fragments, and index.php can read it. That makes the link
// need PHP: on a static host, serve the page without it and change this to the page's own path.
// Rotation is not part of it; a link opens as rendered.
function shareUrl() {
  const t = tileAt(map.getCenter());
  const q = new URLSearchParams({
    x: Math.round(t.x), y: Math.round(t.y), zoom: map.getZoom().toFixed(1),
  });
  // Named after the script rather than the page's own path: the bare directory may be served
  // by index.html, which has no way to answer a crawler with the position.
  const dir = location.pathname.replace(/[^/]*$/, '');
  return `${location.origin}${dir}index.php?${q}`;
}

async function copyText(text) {
  try {
    await navigator.clipboard.writeText(text);
    return true;
  } catch {
    // Clipboard access needs a secure context; a page opened from file:// or plain http has none.
    const box = document.createElement('textarea');
    box.value = text;
    box.style.position = 'fixed';
    box.style.opacity = '0';
    document.body.appendChild(box);
    box.select();
    let ok = false;
    try { ok = document.execCommand('copy'); } catch { /* fall through to the prompt */ }
    box.remove();
    return ok;
  }
}

const share = L.control({ position: 'topleft' });
share.onAdd = function () {
  const div = L.DomUtil.create('div', 'leaflet-bar share');
  const a = L.DomUtil.create('a', '', div);
  a.href = '#';
  a.title = 'Copy a link to this view';
  a.setAttribute('role', 'button');
  a.innerHTML =
    '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" ' +
    'stroke-linecap="round" stroke-linejoin="round"><path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1"/>' +
    '<path d="M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/></svg>';

  L.DomEvent.on(a, 'click', async e => {
    L.DomEvent.stop(e);
    const url = shareUrl();
    if (await copyText(url)) {
      a.title = 'Link copied';
      a.classList.add('copied');
      setTimeout(() => {
        a.title = 'Copy a link to this view';
        a.classList.remove('copied');
      }, 2000);
    } else {
      window.prompt('Copy this link:', url);
    }
  });
  L.DomEvent.disableClickPropagation(div);
  return div;
};
share.addTo(map);

// --- coordinates -------------------------------------------------------------------

// Inverse of the renderer's projection at ground level. Height is unknowable from a
// pixel alone, so anything standing on a hill reads as the tile its base would occupy
// were the ground flat.
function tileAt(latlng) {
  const a = (latlng.lng - CFG.originX) / CFG.halfTile;
  const b = (latlng.lat - CFG.originY) / CFG.halfTile;
  return { x: (a + b) / 2, y: (b - a) / 2 };
}

// One unit of z lifts what stands there 4 canvas px (TILE_Z_SCALE) up the screen, at the
// canvas's own scale. Without it a marker on a hill or an upper floor is drawn at the foot
// of the ground below it, which is where the terrain is but not where the mobile is.
const Z_LIFT = 4 * CFG.halfTile / 22;

function canvasAt(tileX, tileY, z = 0) {
  return L.latLng(
    CFG.halfTile * (tileX + tileY) - z * Z_LIFT + CFG.originY,
    CFG.halfTile * (tileX - tileY) + CFG.originX);
}

// Map tile per screen pixel at the current zoom, which is what decides whether a label
// beside a marker is legible or a thousand of them are one smear.
function tilePixels() {
  return 2 * CFG.halfTile * Math.pow(2, map.getZoom() - CFG.gridMaxZoom);
}

// A standing remark in the corner. Its own control rather than Leaflet's attribution,
// which this page turns off. Controls in a bottom corner are inserted above whatever is
// already there, so adding this before the readout is what leaves it at the very bottom.
const credit = L.control({ position: 'bottomleft' });
credit.onAdd = function () {
  const div = L.DomUtil.create('div', 'credit');
  div.innerHTML =
    '<a href="https://github.com/OldSW/swmaprenderer" target="_blank" rel="noopener">' +
    'built with SW Map Renderer</a>';
  // Without this a click on the link is also a click on the map, which the popup and
  // marker handlers would act on.
  L.DomEvent.disableClickPropagation(div);
  return div;
};
credit.addTo(map);

const readout = L.control({ position: 'bottomleft' });
readout.onAdd = function () {
  this._div = L.DomUtil.create('div', 'readout');
  this.update();
  return this._div;
};
readout.update = function (latlng) {
  if (!latlng) {
    this._div.innerHTML = `map${CFG.mapIndex} &middot; ${CFG.mapWidth}&times;${CFG.mapHeight} tiles ` +
    `&middot; levels ${CFG.minZoom}-${CFG.maxZoom} @ ${CFG.tilePixels.toFixed(2)}px/tile`;
    return;
  }
  const t = tileAt(latlng);
  const inside = t.x >= 0 && t.y >= 0 && t.x < CFG.mapWidth && t.y < CFG.mapHeight;
  this._div.innerHTML = inside
    ? `map${CFG.mapIndex} &middot; <b>${Math.floor(t.x)}, ${Math.floor(t.y)}</b> &middot; zoom ${map.getZoom().toFixed(1)}`
    : `map${CFG.mapIndex} &middot; <b>off map</b> &middot; zoom ${map.getZoom().toFixed(1)}`;
};
readout.addTo(map);

map.on('mousemove', e => readout.update(e.latlng));
map.on('mouseout', () => readout.update());
map.on('zoomend', () => readout.update());

// --- points of interest ------------------------------------------------------------

// Markers may be embedded in this page or fetched from a shard's API, and an API's own
// record shape is not ours to dictate, so everything goes through one reader. What it
// needs from a record is a name and somewhere to put it; the rest is decoration.
// How each category looks, folded so that "Town" and "town" are one type. It comes from
// the "types" block of the same envelope that carries the markers, so each source brings
// its own and they are merged once all are in.
let looks = new Map();

function readLook(t, nested) {
  const o = typeof t === 'string' ? { icon: t } : t || {};
  const icon = text(o.icon);
  // The colour goes into a style attribute, so only something the browser itself
  // accepts as a colour gets that far.
  const color = text(o.color);
  const look = {
    icon,
    // Left undefined when unsaid, so that a subtype can tell "no opinion" from "show it".
    label: typeof o.label === 'boolean' ? o.label : undefined,
    // Per type, not per subtype: it is the category that is a place with an extent.
    outline: o.outline === true,
    color: color && CSS.supports('color', color) ? color : '',
  };

  // Two levels only, as in the legend: a subtype's own "subtypes" is ignored.
  if (!nested) {
    look.subtypes = new Map();
    const subs = o.subtypes && typeof o.subtypes === 'object' ? o.subtypes : {};
    for (const [key, sub] of Object.entries(subs))
      look.subtypes.set(fold(key.trim()), readLook(sub, true));
  }

  return look;
}

function readTypes(raw) {
  const types = raw && typeof raw === 'object' && !Array.isArray(raw) ? raw.types : null;
  const out = new Map();
  if (!types || typeof types !== 'object') return out;

  for (const [key, t] of Object.entries(types))
    out.set(fold(key.trim()), readLook(t, false));

  return out;
}

// A subtype's look over its category's. What the subtype leaves unsaid is inherited, except
// that a colour of its own takes the category's icon away: it asked for a dot, and an icon
// would win over it.
function lookOf(category, subtype) {
  const base = (category && looks.get(fold(category))) || {};
  const sub = subtype && base.subtypes && base.subtypes.get(fold(subtype));
  if (!sub) return base;
  return {
    icon: sub.icon || (sub.color ? '' : base.icon),
    color: sub.color || base.color,
    label: sub.label ?? base.label,
    outline: base.outline,
  };
}

// The marker's picture: its own icon, else its subtype's, else its type's, else the dot,
// painted in the most specific colour there is.
function glyph(category, dot, own, subtype) {
  const { icon: typeIcon, color } = lookOf(category, subtype);
  const icon = own || typeIcon;
  if (icon) return `<img src="${esc(icon)}" alt="">`;
  return `<i${dot ? ' class="dot"' : ''}${color ? ` style="--c:${esc(color)}"` : ''}></i>`;
}

// The value at a dotted path ("pos.east", "loc.0"), or undefined where any step is missing.
const pluck = (o, path) => String(path).split('.')
  .reduce((v, k) => v == null ? undefined : v[k], o);

// A mapped property is taken from its path alone, so that one that is not there leaves
// the record without it rather than falling back to a same-named property that means
// something else. Mirrors PointsOfInterest.Remap, which does the same for a file.
function remap(r, f) {
  const c = { ...r };
  for (const k of ['name', 'category', 'subtype', 'description', 'icon', 'url', 'mapId'])
    if (f[k]) c[k] = pluck(r, f[k]);

  if (f.position) c.position = pluck(r, f.position);

  if (f.x || f.y || f.z) {
    const base = c.position && typeof c.position === 'object' ? c.position : {};
    const axis = k => f[k] ? pluck(r, f[k]) : base[k];
    c.position = { x: axis('x'), y: axis('y'), z: axis('z') };
  }

  return c;
}

// src is what the configuration says about a fetched source: which array to read, and
// the category, facet and looks to assume for what the API itself does not say.
function readPois(raw, src = {}) {
  const types = readTypes(raw);
  for (const [key, t] of readTypes({ types: src.types }))
    types.set(key, t);

  const list = Array.isArray(raw) ? raw
    : !raw || typeof raw !== 'object' ? []
    : (src.key ? [src.key] : ['pois', 'points', 'items', 'results', 'data'])
        .map(k => raw[k]).find(Array.isArray) || [];

  const out = [];
  for (const record of list) {
    if (!record || typeof record !== 'object') continue;
    const r = src.fields ? remap(record, src.fields) : record;

    // A record that names a facet and means a different one is not ours to draw. One
    // that names none is taken to be on the facet this pyramid covers.
    const facet = typeof r.mapId === 'number' ? r.mapId
      : typeof r.map === 'number' ? r.map : src.mapId ?? null;
    if (facet !== null && facet !== CFG.mapIndex) continue;

    const name = text(r.name) || text(r.title) || text(r.label);
    if (!name) continue;

    const at = place(r.position) || place(r.go) || place(r) || middle(r.coords);
    if (!at) continue;

    const category = text(r.category) || text(r.type) || text(src.category);
    const subtype = text(r.subtype) || text(r.subType) || text(r.subcategory);
    out.push({
      name, category, subtype,
      x: at.x, y: at.y, z: at.z,
      description: text(r.description) || text(r.desc),
      icon: text(r.icon),
      area: areaOf(r),
      url: linkOf(text(r.url) || text(r.link)),
      // Only the embedded list is ours; a third party's own "order" means something else.
      order: src.name === 'embedded' && Number.isInteger(r.order) ? r.order : undefined,
      key: fold(name + ' ' + category + ' ' + subtype),
    });
  }

  return { pois: out, types };
}

const text = v => typeof v === 'string' ? v.trim() : '';

// A link is only ever followed if it is http(s) or relative: a record from a third party's
// API must not be able to plant a `javascript:` URL in a popup.
const linkOf = v => /^https?:/i.test(v) || (v && !/^[a-z][a-z0-9+.-]*:/i.test(v)) ? v : '';

// The rectangles a record covers, as [x1, y1, x2, y2] with x1 <= x2: either the embedded
// list's own `area`, or a region export's `coords`. A rectangle runs from its start tile up
// to, not through, its end tile, as a UO Rectangle2D does.
function areaOf(r) {
  const out = [];
  const add = (x1, y1, x2, y2) => {
    if ([x1, y1, x2, y2].every(Number.isFinite))
      out.push([Math.min(x1, x2), Math.min(y1, y2), Math.max(x1, x2), Math.max(y1, y2)]);
  };

  if (Array.isArray(r.area))
    for (const a of r.area) if (Array.isArray(a) && a.length === 4) add(...a.map(Number));

  if (out.length === 0 && Array.isArray(r.coords))
    for (const c of r.coords)
      if (c && c.start && c.end) add(Number(c.start.x), Number(c.start.y), Number(c.end.x), Number(c.end.y));

  return out;
}

function place(o) {
  if (!o || typeof o !== 'object') return null;
  const x = Number(o.x), y = Number(o.y), z = Number(o.z);
  if (!Number.isFinite(x) || !Number.isFinite(y)) return null;
  // (0, 0) is the corner of the void, and what an export writes for a record that has no
  // position of its own. Read as absent rather than placed in the ocean.
  if (x === 0 && y === 0) return null;
  return { x: Math.round(x), y: Math.round(y), z: Number.isFinite(z) ? Math.round(z) : 0 };
}

// A record that covers an area rather than naming a spot -- a region export -- gets its
// marker in the middle of the first rectangle it lists.
function middle(coords) {
  for (const c of Array.isArray(coords) ? coords : []) {
    if (!c || !c.start || !c.end) continue;
    const p = place({
      x: (Number(c.start.x) + Number(c.end.x)) / 2,
      y: (Number(c.start.y) + Number(c.end.y)) / 2,
    });
    if (p) return p;
  }
  return null;
}

// Case and accents are noise when someone is typing a place name from memory, and this
// is a German shard: "Stuetzpunkt" should find "Stützpunkt", and ss should find ß.
const fold = s => s.toLowerCase()
  .replace(/ß/g, 'ss')
  .normalize('NFD').replace(/[̀-ͯ]/g, '');

// Names arrive from an API, so nothing from a record reaches the DOM unescaped.
const esc = s => String(s).replace(/[&<>"']/g,
  c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

let pois = [];

// One checkbox per kind of place the data turned out to hold. What kinds those are is
// the shard's business rather than ours, so the list is discovered, not declared.
let kinds = [];
// What the legend has switched off, as category + subtype pairs. The leaves are what is
// toggled: a category's own box is derived from its subtypes, so there is one state to keep
// in step rather than two. Kept across refreshes, since a source that polls rebuilds the
// legend each time and a kind someone hid has to stay hidden.
let off = new Set();
// Categories whose subtypes are showing. Folded is the default, since a category can have
// dozens of them; like `off`, it outlives the legend's rebuilds.
let unfolded = new Set();
const leafKey = (category, subtype) => (category || '') + '\u0000' + (subtype || '');
const isOn = p => !off.has(leafKey(p.category, p.subtype));
let pending = null;
const poiLayer = L.layerGroup().addTo(map);

// Labels below this are illegible en masse: at 0.1px per tile the whole facet is 400px
// across and every name on it is stacked in the same place. A handful of markers never
// reach that state though, so a sparse view is labelled at any zoom -- eighteen towns
// on a whole facet are exactly what you want named.
const LABEL_FROM = 0.4;
const LABEL_ANY_ZOOM_UNDER = 40;

// More markers than this in view is a smear rather than information. The ones nearest
// the middle of the screen win, because that is what the view is pointed at.
const MAX_MARKERS = 400;

// Icons are drawn at their own size, which is right close up and a pile of overlapping
// sprites on a whole-facet view where a town is a few pixels across. They shrink with the
// zoom, by the square root so that they fade down rather than collapse, and are full size
// from ICON_FULL_AT px per tile; ICON_MIN keeps the smallest still recognisable.
const ICON_FULL_AT = 2;
const ICON_MIN = 0.35;

// Past ICON_GROW_AT px per tile (zoom 8 on a 44px/tile pyramid) the icon keeps pace with the
// map instead of staying a fixed size on screen: a 28px avatar that covered a few tiles there
// is a speck beside a building once the view is magnified, which reads as the icon shrinking.
// ICON_MAX stops it ballooning in the overzoom, where the tiles are upscaled and a huge
// avatar is only in the way.
const ICON_GROW_AT = 22;
const ICON_MAX = 2.5;

function iconScale() {
  const px = tilePixels();
  if (px > ICON_GROW_AT) return Math.min(ICON_MAX, px / ICON_GROW_AT);
  return Math.min(1, Math.max(ICON_MIN, Math.sqrt(px / ICON_FULL_AT)));
}

// The outer boundary of a set of rectangles, as closed rings of [x, y] tile corners: where
// rectangles touch or overlap there is no line, so a town of sixteen is one shape rather than
// sixteen boxes. Done on the grid the rectangles' own edges make, which is small however big
// the town, by listing the sides of covered cells that have an uncovered neighbour and
// chaining them end to start. A gap between rectangles, or a corner they only meet at, leaves
// separate rings, which is what the ground does too.
function boundaryOf(area) {
  const xs = [...new Set(area.flatMap(r => [r[0], r[2]]))].sort((a, b) => a - b);
  const ys = [...new Set(area.flatMap(r => [r[1], r[3]]))].sort((a, b) => a - b);
  const col = new Map(xs.map((x, i) => [x, i])), row = new Map(ys.map((y, i) => [y, i]));

  const covered = new Set();
  for (const [x1, y1, x2, y2] of area)
    for (let i = col.get(x1); i < col.get(x2); i++)
      for (let j = row.get(y1); j < row.get(y2); j++)
        covered.add(i + ',' + j);

  // Every edge runs with the covered cell on its right, so rings come out the same way round.
  const edges = new Map();
  const add = (x1, y1, x2, y2) => {
    const k = x1 + ',' + y1;
    if (!edges.has(k)) edges.set(k, []);
    edges.get(k).push([x2, y2]);
  };
  for (const key of covered) {
    const [i, j] = key.split(',').map(Number);
    const x1 = xs[i], x2 = xs[i + 1], y1 = ys[j], y2 = ys[j + 1];
    if (!covered.has(i + ',' + (j - 1))) add(x1, y1, x2, y1);
    if (!covered.has((i + 1) + ',' + j)) add(x2, y1, x2, y2);
    if (!covered.has(i + ',' + (j + 1))) add(x2, y2, x1, y2);
    if (!covered.has((i - 1) + ',' + j)) add(x1, y2, x1, y1);
  }

  const rings = [];
  for (const [start, outs] of edges) {
    while (outs.length) {
      const ring = [start.split(',').map(Number)];
      let at = outs.pop();
      while (at.join() !== start) {
        ring.push(at);
        at = edges.get(at.join()).pop();
      }
      // Only the corners: a run of collinear points is the same line, drawn heavier.
      const n = ring.length;
      rings.push(ring.filter((p, i) => {
        const a = ring[(i + n - 1) % n], b = ring[(i + 1) % n];
        return (p[0] - a[0]) * (b[1] - p[1]) !== (p[1] - a[1]) * (b[0] - p[0]);
      }));
    }
  }
  return rings;
}

// A type that asks for it has the area its marker stands for drawn as well. This is a pass of
// its own rather than part of the marker loop, because the marker is capped to the ones
// nearest the middle of the screen and the middle of a large town can be off it while its
// walls are not. Not interactive: it must never be in the way of the marker's own click.
function drawOutlines(view) {
  for (const p of pois) {
    if (!p.area || p.area.length === 0 || !isOn(p) || !lookOf(p.category, p.subtype).outline) continue;

    // Tile corners, hence x2 and y2 as they are: a rectangle ends where its last tile does
    // not begin. Worked out once per marker, not once per redraw.
    p.rings ??= boundaryOf(p.area).map(ring => ring.map(([x, y]) => canvasAt(x, y)));
    if (!view.intersects(L.latLngBounds(p.rings.flat()))) continue;

    const color = lookOf(p.category, p.subtype).color || '#ffd479';
    L.polygon(p.rings, { color, weight: 2, opacity: 0.9, fillColor: color, fillOpacity: 0.08, interactive: false })
      .addTo(poiLayer);
  }
}

function drawPois() {
  const scale = iconScale();
  map.getContainer().style.setProperty('--icon-scale', scale.toFixed(3));
  // The label sits beside the icon, so it has to move out as the icon grows; it stays put
  // while the icon shrinks, which is how it has always looked.
  map.getContainer().style.setProperty('--icon-grow', Math.max(1, scale).toFixed(3));
  poiLayer.clearLayers();
  if (pois.length === 0) return;

  const view = map.getBounds().pad(0.1);
  const centre = map.getCenter();

  drawOutlines(view);

  const near = [];
  for (const p of pois) {
    if (!isOn(p)) continue;
    const at = canvasAt(p.x, p.y, p.z);
    if (!view.contains(at)) continue;
    const dx = at.lng - centre.lng, dy = at.lat - centre.lat;
    near.push({ poi: p, at, d: dx * dx + dy * dy });
  }
  near.sort((a, b) => a.d - b.d);

  // Whatever was just searched for is drawn even if the cap would have cut it; being
  // sent somewhere and finding no marker there is worse than one pin too many.
  if (pending && !near.slice(0, MAX_MARKERS).some(n => n.poi === pending)) {
    near.unshift({ poi: pending, at: canvasAt(pending.x, pending.y, pending.z), d: -1 });
  }

  const drawing = near.slice(0, MAX_MARKERS);
  const labelled = drawing.length <= LABEL_ANY_ZOOM_UNDER || tilePixels() >= LABEL_FROM;

  for (const n of drawing) {
    const marker = markerFor(n.poi, n.at, labelled).addTo(poiLayer);
    if (n.poi === pending) {
      marker.openPopup();
      pending = null;
    }
  }
}

function markerFor(p, at, labelled) {
  const marker = L.marker(at, {
    keyboard: false,
    riseOnHover: true,
    icon: L.divIcon({
      className: 'poi',
      html: glyph(p.category, false, p.icon, p.subtype) + (labelled && lookOf(p.category, p.subtype).label !== false ? `<span>${esc(p.name)}</span>` : ''),
      iconSize: null,
      iconAnchor: [0, 0],
      popupAnchor: [0, -8],
    }),
  });

  const icon = p.icon || lookOf(p.category, p.subtype).icon;
  marker.bindTooltip((icon ? `<img class="tip" src="${esc(icon)}" alt="">` : '') + esc(p.name),
    { direction: 'top', offset: [0, -8] });

  // autoPan would move the map, which would redraw the markers, which would reopen this
  // popup: the view is already centred on it by the time it opens.
  marker.bindPopup(
    `<div class="pop">${icon ? `<img class="tip" src="${esc(icon)}" alt="">` : ''}<b>${p.url ? `<a href="${esc(p.url)}" target="_blank" rel="noopener">${esc(p.name)}</a>` : esc(p.name)}</b>` +
    (p.category ? `<div class="cat">${esc(p.category)}${p.subtype ? ' › ' + esc(p.subtype) : ''}</div>` : '') +
    (p.description ? `<div class="desc">${esc(p.description)}</div>` : '') +
    `<div class="at">${p.x}, ${p.y}, ${p.z}</div></div>`,
    { autoPan: false });

  return marker;
}

// --- find: a tile, or a place by name ------------------------------------------------

const find = L.control({ position: 'topright' });
find.onAdd = function () {
  const div = L.DomUtil.create('div', 'readout find');
  div.innerHTML =
    '<div class="row">' +
      '<input type="text" id="q" placeholder="x, y or name" autocomplete="off" spellcheck="false">' +
      '<button id="go" type="button">go</button>' +
    '</div>' +
    '<div class="kinds off" id="kinds"></div>' +
    '<ul id="hits"></ul>';
  L.DomEvent.disableClickPropagation(div);
  L.DomEvent.disableScrollPropagation(div);
  return div;
};
find.addTo(map);

const $q = document.getElementById('q');
const $hits = document.getElementById('hits');
const $kinds = document.getElementById('kinds');

/// Two numbers mean a tile; anything else is a name to look up.
function asTile(value) {
  const parts = value.split(/[,\s]+/).filter(Boolean);
  if (parts.length !== 2) return null;
  const x = Number(parts[0]), y = Number(parts[1]);
  return Number.isFinite(x) && Number.isFinite(y) ? { x, y } : null;
}

function search(query) {
  const q = fold(query.trim());
  if (!q) return [];

  const hits = [];
  for (const p of pois) {
    // A kind that has been switched off is one the reader has said they do not care
    // about, so it should not be what a search sends them to either.
    if (!isOn(p)) continue;
    const i = p.key.indexOf(q);
    if (i < 0) continue;
    // What someone types is far more often the start of a name than the middle of one,
    // and a match at a word boundary beats one buried inside a word.
    const rank = i === 0 ? 0 : /[\s'(\-]/.test(p.key[i - 1]) ? 1 : 2;
    hits.push({ rank, p });
  }

  hits.sort((a, b) =>
    a.rank - b.rank || a.p.name.length - b.p.name.length || a.p.name.localeCompare(b.p.name));
  return hits.slice(0, 12).map(h => h.p);
}

let shown = [];
let cursor = -1;

function showHits(list) {
  shown = list;
  cursor = -1;
  $hits.innerHTML = list.map((p, i) =>
    `<li data-i="${i}">${esc(p.name)}<span class="at">${p.x}, ${p.y}</span></li>`).join('');
}

// Arrowing past either end comes back round, which is the least surprising thing a
// twelve-item list can do.
const wrap = i => shown.length === 0 ? -1 : (i + shown.length) % shown.length;

function highlight(i) {
  cursor = wrap(i);
  for (const li of $hits.children) li.classList.remove('on');
  if (cursor >= 0) $hits.children[cursor].classList.add('on');
}

function goToTile(x, y) {
  map.setView(canvasAt(x, y), Math.max(map.getZoom(), CFG.maxZoom - 1));
}

function goToPoi(p) {
  $q.value = p.name;
  showHits([]);
  pending = p;
  goToTile(p.x, p.y);
  // setView does nothing when the view is already there, and then no moveend arrives to
  // draw the marker whose popup is waiting to open.
  drawPois();
}

function go() {
  const tile = asTile($q.value);
  if (tile) { showHits([]); goToTile(tile.x, tile.y); return; }
  const hit = cursor >= 0 ? shown[cursor] : shown[0];
  if (hit) goToPoi(hit);
}

$q.addEventListener('input', () => {
  showHits(asTile($q.value) ? [] : search($q.value));
});

$q.addEventListener('keydown', e => {
  if (e.key === 'Enter') { go(); e.preventDefault(); }
  else if (e.key === 'Escape') { showHits([]); $q.blur(); }
  else if (e.key === 'ArrowDown') { highlight(cursor + 1); e.preventDefault(); }
  else if (e.key === 'ArrowUp') { highlight(cursor - 1); e.preventDefault(); }
});

$hits.addEventListener('click', e => {
  const li = e.target.closest('li');
  if (li) goToPoi(shown[Number(li.dataset.i)]);
});

document.getElementById('go').addEventListener('click', go);

function listKinds() {
  const groups = new Map();
  // Where a kind sits in the legend, set by rebuild(). A kind that two sources share
  // belongs to the earlier one.
  for (const p of pois) {
    let g = groups.get(p.category);
    if (!g) groups.set(p.category, g = { category: p.category, count: 0, rank: Infinity, subs: new Map() });
    g.count++;
    g.rank = Math.min(g.rank, p.rank);
    g.subs.set(p.subtype, (g.subs.get(p.subtype) || 0) + 1);
  }

  kinds = [...groups.values()]
    // The bucket for records that named no kind is not itself a kind, so it goes last.
    // Otherwise by source, then by the order its "types" block lists them in. A kind a
    // source does not list comes after the ones it does, alphabetically.
    .sort((a, b) => (!a.category) - (!b.category) ||
      a.rank - b.rank || a.category.localeCompare(b.category));

  for (const k of kinds) {
    // Subtypes in the order the type lists them; unlisted ones after, alphabetically, and
    // the records that named none last, as the kind-less bucket does.
    const order = [...(lookOf(k.category).subtypes?.keys() ?? [])];
    const at = s => { const i = order.indexOf(fold(s)); return i < 0 ? order.length : i; };
    k.subs = [...k.subs]
      .map(([subtype, count]) => ({ subtype, count }))
      .sort((a, b) => (!a.subtype) - (!b.subtype) || at(a.subtype) - at(b.subtype) ||
        a.subtype.localeCompare(b.subtype));
  }

  // Data with no kinds in it at all reduces to the single switch this replaced, and
  // calling that one row "uncategorised" would be pedantry.
  const solo = kinds.length === 1 && !kinds[0].category;

  const anyRefined = kinds.some(k => k.subs.some(s => s.subtype));

  $kinds.innerHTML = kinds.map((k, i) => {
    // A kind whose records all name no subtype has nothing to refine, so no rows under it.
    const refined = k.subs.some(s => s.subtype);
    const shown = unfolded.has(k.category);
    return '<label>' +
      (refined
        ? `<button type="button" class="fold${shown ? ' open' : ''}" data-c="${i}" aria-label="show subtypes"></button>`
        : anyRefined ? '<span class="gap"></span>' : '') +
      '<input type="checkbox" data-i="' + i + '">' +
      (lookOf(k.category).icon || lookOf(k.category).color ? glyph(k.category, true) : '') +
      `<span class="of">${esc(solo ? 'markers' : k.category || 'uncategorised')}</span>` +
      `<span class="n">${k.count}</span></label>` +
      (refined ? `<div class="subs${shown ? '' : ' shut'}">` + k.subs.map((s, j) =>
        '<label class="sub"><input type="checkbox" data-i="' + i + '" data-j="' + j + '">' +
        ((lookOf(k.category, s.subtype).icon || lookOf(k.category, s.subtype).color)
          ? glyph(k.category, true, '', s.subtype) : '') +
        `<span class="of">${esc(s.subtype || 'other')}</span>` +
        `<span class="n">${s.count}</span></label>`).join('') + '</div>' : '');
  }).join('');

  // A source that has never answered is said so, by name when there is more than one to
  // tell apart. One that answered once and then failed keeps its markers and stays quiet.
  for (const src of sources.filter(src => src.failure)) {
    $kinds.insertAdjacentHTML('beforeend', '<div class="note">markers unavailable' +
      (sources.length > 1 ? ` from ${esc(src.name)}` : '') + ` (${esc(src.failure)})</div>`);
  }

  $kinds.classList.toggle('off', $kinds.innerHTML === '');
  syncKinds();
}

// Checkboxes follow `off`, not the other way round. A kind's own box is checked when all of
// its subtypes are, and half-way when only some are.
function syncKinds() {
  for (const box of $kinds.querySelectorAll('input')) {
    const k = kinds[box.dataset.i];
    const mine = box.dataset.j === undefined ? k.subs : [k.subs[box.dataset.j]];
    const on = mine.filter(s => !off.has(leafKey(k.category, s.subtype))).length;
    box.checked = on === mine.length;
    box.indeterminate = on > 0 && on < mine.length;
  }
}

// The arrow sits inside the category's label, so the click has to be kept from reaching the
// checkbox that label belongs to.
$kinds.addEventListener('click', e => {
  const arrow = e.target.closest('.fold');
  if (!arrow) return;
  e.preventDefault();

  const category = kinds[arrow.dataset.c].category;
  const shown = !unfolded.has(category);
  if (shown) unfolded.add(category); else unfolded.delete(category);
  arrow.classList.toggle('open', shown);
  arrow.parentElement.nextElementSibling.classList.toggle('shut', !shown);
});

$kinds.addEventListener('change', e => {
  const i = e.target.dataset.i;
  if (i === undefined) return;

  const k = kinds[i];
  const mine = e.target.dataset.j === undefined ? k.subs : [k.subs[e.target.dataset.j]];
  for (const s of mine) {
    const key = leafKey(k.category, s.subtype);
    if (e.target.checked) off.delete(key); else off.add(key);
  }

  syncKinds();
  // The result list is drawn through the same filter, so it cannot be left showing hits
  // for a kind that was just switched off.
  showHits(asTile($q.value) ? [] : search($q.value));
  drawPois();
});

map.on('moveend zoomend', drawPois);

// Where the markers come from, in the order their looks are merged: what was embedded
// first, then each fetched source as the configuration listed them, so a later one
// overrides an earlier one however the responses happen to arrive.
const sources = [
  ...(POIS ? [{ name: 'embedded', data: readPois(POIS, { name: 'embedded' }), failure: '' }] : []),
  ...CFG.poiSources.map(s => ({ ...s, data: null, failure: '', attempted: false })),
];

// Room for every source's "types" list to be ranked inside its own band of numbers.
const SOURCE_STRIDE = 1e6;

function rebuild() {
  pois = [];
  looks = new Map();

  sources.forEach((src, i) => {
    if (!src.data) return;
    const order = [...src.data.types.keys()];
    for (const p of src.data.pois) {
      const at = order.indexOf(fold(p.category));
      p.rank = (p.order ?? src.order ?? i) * SOURCE_STRIDE + (at < 0 ? SOURCE_STRIDE - 1 : at);
    }
    pois.push(...src.data.pois);
    for (const [category, look] of src.data.types) looks.set(category, look);
  });

  pois.sort((a, b) => a.name.localeCompare(b.name));
  listKinds();
  drawPois();
}

async function fetchSource(src) {
  // no-store: a refresh that is answered from the browser's cache refreshes nothing.
  const response = await fetch(src.url, {
    headers: { Accept: 'application/json' }, cache: 'no-store',
  });
  if (!response.ok) throw new Error(`HTTP ${response.status}`);
  return response.json();
}

async function pollSource(src) {
  // A background tab has nobody to show it to; the first tick after it is looked at
  // again catches up. The first fetch happens regardless.
  if (!document.hidden || !src.attempted) {
    src.attempted = true;

    try {
      // An API that now returns nothing means nothing is there, not that it failed, so
      // an empty answer replaces the markers like any other.
      src.data = readPois(await fetchSource(src), src);
      src.failure = '';
      rebuild();
    } catch (e) {
      if (src.data) {
        // Keep what is on the map. Blanking it because one poll failed would make every
        // blip in the API look like the shard had lost its towns.
        console.warn(`marker refresh from ${src.url} failed:`, e.message);
      } else {
        // A page served from file:// cannot fetch cross-origin, and neither can one whose
        // API sends no CORS header, so say what happened rather than showing nothing.
        src.failure = e.message;
        rebuild();
      }
    }
  }

  // Chained rather than setInterval, so a slow API cannot pile requests up behind
  // itself, and a failure does not end the refreshing -- the shard may just be
  // restarting.
  if (src.refreshSeconds > 0) setTimeout(() => pollSource(src), src.refreshSeconds * 1000);
}

function loadPois() {
  if (POIS) rebuild();
  for (const src of sources) if (src.url) pollSource(src);
}

// --- shareable position ------------------------------------------------------------

// A position can be given as #x,y[,zoom] or as ?x=..&y=..[&zoom=..]. The hash is what the page
// writes as the view moves, so it is the more current of the two and wins; the query is for
// links typed or generated by hand, and is never rewritten.
function parsePosition() {
  const m = /^#(-?\d+(?:\.\d+)?),(-?\d+(?:\.\d+)?)(?:,(\d+(?:\.\d+)?))?$/.exec(location.hash);
  if (m) return { x: Number(m[1]), y: Number(m[2]), zoom: m[3] ? Number(m[3]) : null };

  const q = new URLSearchParams(location.search);
  const num = v => (v !== null && v.trim() !== '' && Number.isFinite(Number(v))) ? Number(v) : null;
  const x = num(q.get('x')), y = num(q.get('y'));
  if (x === null || y === null) return null;
  return { x, y, zoom: num(q.get('zoom') ?? q.get('z')) };
}

function applyHash() {
  const p = parsePosition();
  if (!p) return false;
  map.setView(canvasAt(p.x, p.y), p.zoom !== null ? Math.min(VIEW_MAX, p.zoom) : CFG.maxZoom - 1);
  return true;
}

let writingHash = false;

map.on('moveend zoomend', () => {
  const t = tileAt(map.getCenter());
  writingHash = true;
  location.replace(`#${Math.round(t.x)},${Math.round(t.y)},${map.getZoom().toFixed(1)}`);
  // hashchange is queued, so the flag has to outlive this turn of the event loop.
  setTimeout(() => { writingHash = false; }, 0);
});

if (!applyHash()) {
  // The hash wins over a configured start, or a link someone shared would open somewhere
  // else the moment the page had one.
  if (CFG.start) {
    map.setView(canvasAt(CFG.start.x, CFG.start.y),
      Math.min(VIEW_MAX, CFG.start.zoom ?? CFG.maxZoom - 1));
  } else {
    map.fitBounds(bounds);
  }
}
window.addEventListener('hashchange', () => { if (!writingHash) applyHash(); });

loadPois();
</script>
</body>
</html>
