name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  build:
    name: ${{ matrix.rid }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,  rid: linux-x64,   archive: tar.gz }
          - { os: ubuntu-latest,  rid: linux-arm64, archive: tar.gz }
          - { os: windows-latest, rid: win-x64,     archive: zip }
          - { os: windows-latest, rid: win-arm64,   archive: zip }
          - { os: macos-latest,   rid: osx-x64,     archive: tar.gz }
          - { os: macos-latest,   rid: osx-arm64,   archive: tar.gz }

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v7
        with:
          dotnet-version: '10.0.x'

      - name: Publish
        shell: bash
        # ImageSharp 4.x validates its licence at build time and errors out in
        # Release when none is found. sixlabors.lic is gitignored, so the key is
        # supplied as the MSBuild property $(SixLaborsLicenseKey) — MSBuild picks
        # environment variables up as properties, which keeps the secret off disk
        # and out of the process command line. A key set this way takes precedence
        # over the $(SixLaborsLicenseFile) path the csproj points at locally.
        env:
          SixLaborsLicenseKey: ${{ secrets.SIXLABORS_LICENSE }}
        run: |
          if [ -z "$SixLaborsLicenseKey" ]; then
            echo "::error::Repository secret SIXLABORS_LICENSE is not set. ImageSharp 4.x fails a Release build without it."
            exit 1
          fi
          dotnet publish swmaprenderer.csproj \
            --configuration Release \
            --runtime ${{ matrix.rid }} \
            --self-contained true \
            -p:PublishSingleFile=true \
            -p:IncludeNativeLibrariesForSelfExtract=true \
            -p:DebugType=none \
            --output publish/${{ matrix.rid }}

      - name: Stage package
        shell: bash
        run: |
          staging="staging/swmaprenderer-${{ matrix.rid }}"
          mkdir -p "$staging"
          cp -r publish/${{ matrix.rid }}/. "$staging/"
          cp README.md LICENSE "$staging/"
          chmod +x "$staging/swmaprenderer" 2>/dev/null || true

      - name: Archive (tar.gz)
        if: matrix.archive == 'tar.gz'
        shell: bash
        run: tar -czf "swmaprenderer-${{ matrix.rid }}.tar.gz" -C staging "swmaprenderer-${{ matrix.rid }}"

      - name: Archive (zip)
        if: matrix.archive == 'zip'
        shell: pwsh
        run: Compress-Archive -Path "staging/swmaprenderer-${{ matrix.rid }}" -DestinationPath "swmaprenderer-${{ matrix.rid }}.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: swmaprenderer-${{ matrix.rid }}
          path: swmaprenderer-${{ matrix.rid }}.${{ matrix.archive }}
          if-no-files-found: error

  release:
    name: Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - uses: softprops/action-gh-release@v3
        with:
          files: artifacts/*
          generate_release_notes: true