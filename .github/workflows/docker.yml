name: Docker

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # No QEMU: the Dockerfile builds on the runner's own architecture and cross-publishes
      # for each target, and its last stage only copies files, so nothing ever has to run
      # as arm64 during the build.
      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # A registry rejects upper-case repository names and github.repository keeps the owner's
      # case (OldSW), so lowercase it here with bash's ${var,,} rather than trusting each
      # later step to do it.
      - id: image
        shell: bash
        run: echo "name=${REGISTRY}/${REPOSITORY,,}" >> "$GITHUB_OUTPUT"
        env:
          REPOSITORY: ${{ github.repository }}

      # A v0.3.0 tag gives 0.3.0, 0.3 and latest. A manual run is not a release, so it gets
      # the branch name and the commit instead and leaves latest alone.
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=ref,event=branch
            type=sha

      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
